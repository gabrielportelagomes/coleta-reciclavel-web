<div class="map-container">
  <div id="map"></div>

  <div class="map-loading-overlay" *ngIf="loadingService.mapLoading()">
    <div class="spinner-map"></div>
    <span>Carregando pontos de coleta...</span>
  </div>

  <div class="map-legend">
    <h4>♻️ Pontos de Coleta em Teresina</h4>
    <p>Clique em um marcador para ver detalhes e materiais aceitos.</p>
  </div>
</div>
