<div class="login-container">
  <div class="login-card">
    <h2>🔐 Login Administrativo</h2>
    <p class="subtitle">Entre com suas credenciais para gerenciar os pontos de coleta.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" formControlName="email" placeholder="admin@coleta.com.br" />
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" formControlName="senha" placeholder="••••••••" />
      </div>

      <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="form.invalid" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
